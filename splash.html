<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<meta http-equiv="refresh" content="4; url=home.html">

<style>
body {
    background-image: url("https://media.istockphoto.com/id/2159325850/photo/water-drops-on-green-leaf-purity-nature-background.jpg?s=612x612&w=0&k=20&c=jRxkini4rrGz45wWgcbv4gPa4Vtf8SD5wLrjosP0Ozs=");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    margin: 10px;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transition: opacity 0.5s ease;
}

h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 70px;
    font-weight: 800;
    text-align: center;
    color: #c7a46a;
    text-shadow: 4px 4px 15px #000000;
}

p {
    font-family: Oswald, sans-serif;
    font-size: 30px;
}

ul {
    font-size: 25px;
    list-style: none;
}

.loader {
    border: 5px solid #fff;
    border-top: 5px solid transparent;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin: 20px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

button {
    padding: 10px 20px;
    border: none;
    background: white;
    color: rgb(0, 128, 19);
    border-radius: 10px;
    cursor: pointer;
}
</style>
</head>

<body>
    <h1>Life On Land</h1>

    <p>Protecting ecosystems, forests and biodiversity for a sustainable future.</p>

    <ul>
        <li>Thisal</li>
        <li>Pasindu</li>
        <li>Rusira</li>
        <li>Onija</li>
    </ul>

    <div class="loader"></div>

    <p id="countdown">Entering site in 4...</p>

    <button onclick="skip()">Skip Intro</button>

    <script>
    // Starting time for the countdown
    let time = 4;

    // Run every 1 second
    let countdown = setInterval(function () {
        time--;
        document.getElementById("countdown").textContent = "Entering site in " + time + "...";

        if (time === 0) {
            goHome();
        }
    }, 1000);

    // Skip button
    function skip() {
        goHome();
    }

    // Fade out, then go to the home page
    function goHome() {
        clearInterval(countdown);
        document.body.style.opacity = "0";
        setTimeout(function () {
            window.location.href = "home.html";
        }, 500);
    }
    </script>
</body>
</html>
